server:
  port: 8092
  error:
    include-message: always
    include-binding-errors: always

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/portfolio_e_commerce_db
    username:
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

api:
  security:
    token:
      secret: super-secret-key-para-meu-ecommerce-pessoal-ninguem-pode-saber